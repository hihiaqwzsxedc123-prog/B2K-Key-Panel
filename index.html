<script>
let keys = JSON.parse(localStorage.getItem("B2K_KEYS") || "[]");
let currentModalIndex = null;

const titles = {
  dashboard:"Dashboard",
  generate:"Generate Keys",
  all:"All Keys",
  active:"Active Keys",
  expired:"Expired Keys",
  disabled:"Disabled Keys",
  devices:"Devices",
  settings:"Settings",
  admin:"Admin Panel"
};

function showPage(page, button){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page)?.classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  button?.classList.add("active");

  document.getElementById("pageTitle").textContent = titles[page] || page;
  document.getElementById("sidebar").classList.remove("open");

  refreshUI();
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function setTheme(themeName, btn){
  document.body.className = "";

  if(themeName === "green"){
    document.body.classList.add("theme-green");
  }

  if(themeName === "blue"){
    document.body.classList.add("theme-blue");
  }

  document.querySelectorAll(".theme-btn")
    .forEach(b => b.classList.remove("active-theme"));

  btn.classList.add("active-theme");

  toast("Theme changed to " + themeName);
}

function saveKeys(){
  localStorage.setItem("B2K_KEYS", JSON.stringify(keys));
}

function randomKey(){
  let key = "";

  for(let i = 0; i < 11; i++){
    key += Math.floor(Math.random() * 10);
  }

  return key;
}

function uniqueKey(){
  let key;

  do{
    key = randomKey();
  }while(keys.some(k => k.key === key));

  return key;
}

/* ================= CREATE KEYS ================= */

async function createKeys(duration, quantity){
  duration = Number(duration);
  quantity = Math.max(1, Math.min(100, Number(quantity)));

  if(!duration || !quantity){
    toast("Invalid duration or quantity");
    return;
  }

  let createdCount = 0;

  for(let i = 0; i < quantity; i++){

    const key = uniqueKey();

    try{

      const response = await fetch(
        "https://vvhmcqchxnludtlsfzbi.supabase.co/functions/v1/create-key",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            key:key,
            duration:duration
          })
        }
      );

      const data = await response.json();

      if(!response.ok || !data.success){
        toast(data.error || "Failed to create key");
        return;
      }

      const createdKey = data.key;

      keys.unshift({
        key:createdKey.key,
        duration:Number(createdKey.duration),
        status:createdKey.status || "active",
        created:createdKey.created_at,
        expires:createdKey.expires_at,
        device:createdKey.device_id || "Not linked"
      });

      createdCount++;

    }catch(error){

      console.error(error);
      toast("Connection error");
      return;
    }
  }

  saveKeys();
  refreshUI();

  toast(createdCount + " key(s) created successfully!");
}

/* ================= GENERATE PAGE ================= */

async function generateKeys(){

  const duration =
    document.getElementById("duration").value;

  const quantity =
    document.getElementById("quantity").value;

  await createKeys(duration, quantity);
}

/* ================= QUICK GENERATE ================= */

async function quickGenerate(){

  const duration =
    document.getElementById("quickDuration").value;

  const quantity =
    document.getElementById("quickQuantity").value;

  await createKeys(duration, quantity);
}

/* ================= STATUS ================= */

function getStatus(k){

  if(k.status === "disabled"){
    return "disabled";
  }

  if(!k.expires){
    return "active";
  }

  if(new Date(k.expires) <= new Date()){
    return "expired";
  }

  return "active";
}

function statusText(status){
  return String(status).toUpperCase();
}

function updateStatuses(){

  keys.forEach(k => {

    if(k.status !== "disabled"){

      if(k.expires && new Date(k.expires) <= new Date()){
        k.status = "expired";
      }else{
        k.status = "active";
      }

    }

  });

  saveKeys();
}

/* ================= DATE ================= */

function formatDate(date){

  if(!date){
    return "---";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return "---";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}

/* ================= STATS ================= */

function refreshStats(){

  updateStatuses();

  document.getElementById("totalStat").textContent =
    keys.length;

  document.getElementById("activeStat").textContent =
    keys.filter(k => getStatus(k) === "active").length;

  document.getElementById("expiredStat").textContent =
    keys.filter(k => getStatus(k) === "expired").length;

  document.getElementById("disabledStat").textContent =
    keys.filter(k => getStatus(k) === "disabled").length;
}

/* ================= MODAL ================= */

function viewKey(index){

  currentModalIndex = index;

  const k = keys[index];

  if(!k){
    return;
  }

  document.getElementById("modalKey").textContent =
    k.key;

  document.getElementById("modalDuration").textContent =
    k.duration +
    (Number(k.duration) === 1 ? " Day" : " Days");

  document.getElementById("modalStatus").textContent =
    statusText(getStatus(k));

  document.getElementById("modalCreated").textContent =
    formatDate(k.created);

  document.getElementById("modalExpires").textContent =
    formatDate(k.expires);

  document.getElementById("modalDevice").textContent =
    k.device || "Not linked";

  document.getElementById("modalOverlay")
    .classList.add("show");
}

function closeModal(){

  document.getElementById("modalOverlay")
    .classList.remove("show");

  currentModalIndex = null;
}

/* ================= COPY ================= */

function copyText(text){

  if(!text){
    return;
  }

  if(navigator.clipboard){

    navigator.clipboard
      .writeText(text)
      .then(() => toast("Copied to clipboard!"))
      .catch(() => toast("Copy failed"));

  }else{

    toast("Clipboard not supported");
  }
}

function copyModalKey(){

  if(
    currentModalIndex !== null &&
    keys[currentModalIndex]
  ){

    copyText(
      keys[currentModalIndex].key
    );
  }
}

function copyKey(index){

  if(keys[index]){
    copyText(keys[index].key);
  }
}

/* ================= ENABLE / DISABLE ================= */

function toggleKey(index){

  if(!keys[index]){
    return;
  }

  const current =
    getStatus(keys[index]);

  if(current === "disabled"){

    if(
      keys[index].expires &&
      new Date(keys[index].expires) <= new Date()
    ){

      toast("Cannot enable an expired key");
      return;
    }

    keys[index].status = "active";

  }else{

    keys[index].status = "disabled";
  }

  saveKeys();

  toast(
    keys[index].status === "active"
      ? "Key Enabled"
      : "Key Disabled"
  );

  refreshUI();
}

/* ================= DELETE ================= */

function deleteKey(index){

  if(!keys[index]){
    return;
  }

  if(
    confirm(
      "Delete key " +
      keys[index].key +
      "?"
    )
  ){

    keys.splice(index, 1);

    saveKeys();

    toast("Key deleted");

    refreshUI();
  }
}

/* ================= ROW ================= */

function keyRow(k, index){

  const status = getStatus(k);

  return `
    <tr>

      <td>
        <span class="key-text">
          ${k.key}
        </span>
      </td>

      <td>
        ${k.duration}
        ${Number(k.duration) === 1 ? "Day" : "Days"}
      </td>

      <td>
        <span class="status ${status}">
          ${statusText(status)}
        </span>
      </td>

      <td>
        ${formatDate(k.created)}
      </td>

      <td>

        <button
          class="action-btn view"
          onclick="viewKey(${index})">
          VIEW
        </button>

        <button
          class="action-btn"
          onclick="copyKey(${index})">
          COPY
        </button>

        <button
          class="action-btn"
          onclick="toggleKey(${index})">
          ${status === "disabled" ? "ENABLE" : "DISABLE"}
        </button>

        <button
          class="action-btn"
          onclick="deleteKey(${index})">
          DELETE
        </button>

      </td>

    </tr>
  `;
}

/* ================= ALL KEYS ================= */

function renderAllKeys(){

  updateStatuses();

  const search =
    (
      document.getElementById("searchAll")?.value ||
      ""
    ).toLowerCase();

  const filter =
    document.getElementById("filterAll")?.value ||
    "all";

  const filtered =
    keys.filter(k => {

      const matchesSearch =
        String(k.key).includes(search);

      const matchesFilter =
        filter === "all" ||
        getStatus(k) === filter;

      return matchesSearch && matchesFilter;
    });

  const table =
    document.getElementById("allKeysTable");

  if(!table){
    return;
  }

  if(!filtered.length){

    table.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            No keys found
          </div>
        </td>
      </tr>
    `;

    return;
  }

  table.innerHTML =
    filtered
      .map(k => keyRow(k, keys.indexOf(k)))
      .join("");
}

/* ================= GENERATED ================= */

function renderGenerated(){

  const container =
    document.getElementById("generatedKeys");

  const count =
    document.getElementById("generatedCount");

  if(!container || !count){
    return;
  }

  const recent =
    keys.slice(0, 20);

  count.textContent =
    keys.length +
    (keys.length === 1 ? " KEY" : " KEYS");

  if(!recent.length){

    container.innerHTML =
      `<div class="empty">
        No keys generated yet
      </div>`;

    return;
  }

  container.innerHTML = `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>KEY</th>
            <th>DURATION</th>
            <th>STATUS</th>
            <th>ACTION</th>
          </tr>
        </thead>

        <tbody>

          ${recent.map(k => {

            const index = keys.indexOf(k);
            const status = getStatus(k);

            return `
              <tr>

                <td>
                  <span class="key-text">
                    ${k.key}
                  </span>
                </td>

                <td>
                  ${k.duration}
                  ${Number(k.duration) === 1 ? "Day" : "Days"}
                </td>

                <td>
                  <span class="status ${status}">
                    ${statusText(status)}
                  </span>
                </td>

                <td>

                  <button
                    class="action-btn view"
                    onclick="viewKey(${index})">
                    VIEW
                  </button>

                  <button
                    class="action-btn"
                    onclick="copyKey(${index})">
                    COPY
                  </button>

                </td>

              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* ================= RECENT ================= */

function renderRecent(){

  const container =
    document.getElementById("recentKeys");

  if(!container){
    return;
  }

  const recent =
    keys.slice(0, 5);

  if(!recent.length){

    container.innerHTML =
      `<div class="empty">
        No keys generated yet
      </div>`;

    return;
  }

  container.innerHTML = `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>KEY</th>
            <th>DURATION</th>
            <th>STATUS</th>
            <th>ACTION</th>
          </tr>
        </thead>

        <tbody>

          ${recent.map(k => {

            const index =
              keys.indexOf(k);

            const status =
              getStatus(k);

            return `
              <tr>

                <td>
                  <span class="key-text">
                    ${k.key}
                  </span>
                </td>

                <td>
                  ${k.duration}
                  ${Number(k.duration) === 1 ? "Day" : "Days"}
                </td>

                <td>
                  <span class="status ${status}">
                    ${statusText(status)}
                  </span>
                </td>

                <td>

                  <button
                    class="action-btn view"
                    onclick="viewKey(${index})">
                    VIEW
                  </button>

                  <button
                    class="action-btn"
                    onclick="copyKey(${index})">
                    COPY
                  </button>

                </td>

              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* ================= FILTERED PAGES ================= */

function renderFilteredPage(
  containerId,
  statusWanted
){

  const container =
    document.getElementById(containerId);

  if(!container){
    return;
  }

  const filtered =
    keys.filter(
      k => getStatus(k) === statusWanted
    );

  if(!filtered.length){

    container.innerHTML =
      `<div class="empty">
        No ${statusWanted} keys
      </div>`;

    return;
  }

  container.innerHTML = `
    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>KEY</th>
            <th>DURATION</th>
            <th>STATUS</th>
            <th>CREATED</th>
            <th>ACTION</th>
          </tr>

        </thead>

        <tbody>

          ${filtered
            .map(k =>
              keyRow(k, keys.indexOf(k))
            )
            .join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* ================= REFRESH ================= */

function refreshUI(){

  refreshStats();

  renderRecent();

  renderGenerated();

  renderAllKeys();

  renderFilteredPage(
    "activeKeys",
    "active"
  );

  renderFilteredPage(
    "expiredKeys",
    "expired"
  );

  renderFilteredPage(
    "disabledKeys",
    "disabled"
  );
}

/* ================= CLEAR LOCAL ================= */

function clearData(){

  if(
    confirm(
      "Clear all local keys?"
    )
  ){

    keys = [];

    saveKeys();

    refreshUI();

    toast("Local data cleared");
  }
}

/* ================= TOAST ================= */

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () =>
        el.classList.remove("show"),
      2200
    );
}

/* ================= START ================= */

refreshUI();

setInterval(
  refreshStats,
  30000
);

/* ================= SUPABASE ================= */

const SUPABASE_FUNCTION_URL =
  "https://vvhmcqchxnludtlsfzbi.supabase.co/functions/v1/validate-key";

    </script>
